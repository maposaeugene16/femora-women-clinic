  <!-- Brand Typography -->
  <text x="64" y="34" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="1.5" fill="#48162b">
    FEMORA
  </text>
  <text x="65" y="49" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="2.8" fill="#b83a66">
    WOMEN’S CLINIC
