<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <linearGradient id="femora-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b83a66" />
      <stop offset="100%" stop-color="#48162b" />
    </linearGradient>
    <linearGradient id="femora-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8bf8c" />
      <stop offset="100%" stop-color="#cca15a" />
    </linearGradient>
  </defs>

  <!-- Flower / Bloom / Health Icon -->
